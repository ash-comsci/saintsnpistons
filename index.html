<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#351528">
<meta name="description" content="Saints & Pistons at All Saints High School. Book your vehicle into the school auto shop.">
<title>Saints & Pistons • All Saints Auto Shop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23351528'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-family='Georgia' font-size='29' font-weight='bold' fill='%23b4d6e2'%3ES%3C/text%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark;--wine:#351528;--deep:#210d1b;--ice:#b4d6e2;--white:#f5f9fa;--muted:#bdabb6;--rx:0deg;--ry:0deg;--zoom:1}
  *{box-sizing:border-box}
  html{font-family:Arial,Helvetica,sans-serif;background:var(--deep)}
  body{margin:0;min-width:280px;min-height:100svh;color:var(--white);background:radial-gradient(ellipse at 50% 40%,#613148 0%,#39182d 43%,#210d1b 85%);overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 79px,#ffffff03 80px 81px);z-index:0}
  a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button{font:inherit}
  :focus-visible{outline:3px solid var(--ice);outline-offset:7px}
  .page{position:relative;min-height:100svh;display:flex;flex-direction:column;max-width:1440px;margin:auto;padding:28px 42px 22px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .school{font-size:12px;font-weight:800;letter-spacing:2px;line-height:1.65}
  .school span{display:block;color:var(--muted);font-size:11px;letter-spacing:3.6px;font-weight:400}
  .shop-label{border:1px solid #b4d6e24d;padding:9px 14px;border-radius:40px;color:var(--ice);font-size:11px;font-weight:bold;letter-spacing:2px;white-space:nowrap}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 0 30px}
  .eyebrow{font-size:12px;letter-spacing:5px;color:var(--ice);font-weight:bold;margin:0 0 20px}
  .stage{width:min(68vh,520px,86vw);aspect-ratio:1;position:relative;display:grid;place-items:center;perspective:1000px;isolation:isolate}
  .stage::before{content:"";position:absolute;inset:1%;border:1px solid #b4d6e240;border-radius:50%;transform:rotate(-18deg);transition:transform .8s cubic-bezier(.16,1,.3,1);background:conic-gradient(from 0deg,transparent 0 7%,#b4d6e2 7% 8%,transparent 8% 57%,#b4d6e2 57% 58%,transparent 58%);mask:radial-gradient(transparent 68%,#000 68.5%);-webkit-mask:radial-gradient(transparent 68%,#000 68.5%)}
  .stage::after{content:"";position:absolute;inset:7%;border:1px dashed #b4d6e23b;border-radius:50%;z-index:-1;transition:transform .9s ease}
  .stage:hover::before{transform:rotate(25deg)}
  .stage:hover::after{transform:rotate(-20deg)}
  .logo-enter{width:82%;aspect-ratio:1;animation:arrive .85s cubic-bezier(.16,1,.3,1) both}
  .logo-button{width:100%;height:100%;position:relative;display:grid;place-items:center;border:0;border-radius:50%;background:#f4f8f9;padding:7%;cursor:pointer;transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--zoom));transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s;box-shadow:0 25px 65px #08000c66,inset 0 0 0 10px #e2edf1;will-change:transform}
  .logo-button:hover,.logo-button:focus-visible{--zoom:1.055;box-shadow:0 32px 80px #08000c88,0 0 55px #b4d6e217,inset 0 0 0 10px #e2edf1}
  .logo-button img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;user-select:none;filter:drop-shadow(0 5px 1px #35152812)}
  .logo-button.pop{animation:pop .65s cubic-bezier(.2,.8,.2,1)}
  .fallback{color:var(--wine);font-family:Impact,'Arial Narrow',sans-serif;font-weight:900;line-height:.94;font-size:clamp(36px,7vw,72px);transform:rotate(-5deg);text-shadow:2px 2px var(--ice)}
  .fallback span{display:block}.fallback small{display:block;font:700 12px Arial,sans-serif;letter-spacing:4px;margin-top:18px;text-shadow:none}
  .motion-hint{font-size:11px;letter-spacing:2px;color:var(--muted);margin:10px 0 24px;text-transform:uppercase}
  .booking{display:flex;flex-direction:column;align-items:center}
  h1{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(31px,4.2vw,48px);font-weight:900;letter-spacing:1px;margin:0 0 16px;line-height:1.05;text-transform:uppercase}
  .booking-link{display:inline-flex;align-items:center;justify-content:center;gap:22px;min-height:60px;padding:17px 34px;background:var(--ice);border:1px solid #d4edf5;border-radius:8px;color:var(--wine);text-decoration:none;font-size:17px;font-weight:800;box-shadow:0 6px 0 #718f9c;transition:transform .2s,box-shadow .2s,background .2s}
  .booking-link:hover{background:#d2eaf2;transform:translateY(-3px);box-shadow:0 9px 0 #718f9c}
  .booking-link:active{transform:translateY(4px);box-shadow:0 2px 0 #718f9c}
  .booking-link svg{width:20px;height:20px;flex-shrink:0}
  .booking p{color:#d3c4ce;font-size:14px;line-height:1.6;margin:20px 0 0}
  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:11px;letter-spacing:1.3px;line-height:1.5;border-top:1px solid #ffffff13;padding-top:16px}
  footer strong{font-weight:700;color:var(--ice)}
  [hidden]{display:none!important}
  @keyframes arrive{from{opacity:0;transform:scale(.65) rotate(-9deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes pop{0%,100%{transform:scale(1)}35%{transform:scale(1.1) rotate(-3deg)}65%{transform:scale(.98) rotate(2deg)}}
  @media(min-width:800px) and (max-height:850px){.stage{width:min(52vh,450px)}main{padding:16px 0 22px}.eyebrow{margin-bottom:8px}.motion-hint{margin:4px 0 16px}h1{font-size:36px}}
  @media(max-width:600px){.page{padding:22px 20px 18px}.school{font-size:10px;letter-spacing:1.4px}.school span{font-size:10px;letter-spacing:2px}.shop-label{font-size:10px;letter-spacing:1px;padding:8px 10px}main{padding:30px 0}.eyebrow{font-size:10px;letter-spacing:3px;margin-bottom:12px}.stage{width:min(88vw,430px)}.motion-hint{margin:8px 0 26px;font-size:10px}.booking-link{min-height:58px;padding:16px 30px}.booking p{font-size:13px}footer{font-size:10px;letter-spacing:.6px;flex-wrap:wrap;justify-content:center;text-align:center}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.logo-button{transform:none!important}.motion-hint{visibility:hidden}}
</style>
</head>

<script>
(() => {
  'use strict';
  const button=document.querySelector('.logo-button');
  const logo=document.getElementById('shop-logo');
  const fallback=document.getElementById('logo-fallback');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const pointer=window.matchMedia('(hover: hover) and (pointer: fine)');
  function showLogo(){logo.hidden=false;fallback.hidden=true;}
  function showFallback(){logo.hidden=true;fallback.hidden=false;}
  logo.addEventListener('load',showLogo);
  logo.addEventListener('error',showFallback);
  if(logo.complete){logo.naturalWidth?showLogo():showFallback();}
  let frame=0;
  button.addEventListener('pointermove',event=>{
    if(reduced.matches||!pointer.matches)return;
    const rect=button.getBoundingClientRect();
    const x=Math.max(-1,Math.min(1,(event.clientX-rect.left)/rect.width*2-1));
    const y=Math.max(-1,Math.min(1,(event.clientY-rect.top)/rect.height*2-1));
    cancelAnimationFrame(frame);
    frame=requestAnimationFrame(()=>{button.style.setProperty('--rx',`${-y*8}deg`);button.style.setProperty('--ry',`${x*8}deg`);});
  });
  function reset(){cancelAnimationFrame(frame);button.style.setProperty('--rx','0deg');button.style.setProperty('--ry','0deg');}
  button.addEventListener('pointerleave',reset);
  button.addEventListener('blur',reset);
  reduced.addEventListener('change',reset);
  button.addEventListener('click',()=>{
    if(reduced.matches)return;
    button.classList.remove('pop');
    void button.offsetWidth;
    button.classList.add('pop');
  });
  button.addEventListener('animationend',()=>button.classList.remove('pop'));
})();
</script>
